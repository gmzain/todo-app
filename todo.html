<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    
    <div class="main-container">
        <div class="container">
            <div class="header">
                <h1 class="todo-heading">Todo App</h1>
            </div>
            <div class="btn"> 
                <button class="btn1">All</button> 
                <button class="btn2">Complete</button> 
                <button class="btn3">Pending</button> 
            </div>
            <div class="search-box">
                <input type="text" placeholder="Search" class="search">
            </div>
            <div class="todo">
                <div>
                    <h2 class="task">Task</h2>
                </div>
                <div>
                    <input type="text" placeholder="Add Task" class="input">
                    <button class="add">Add</button>
                </div>
            </div>
            <div class="task-list"></div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
