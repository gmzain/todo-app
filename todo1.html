<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="todo1.css">
</head>
<body>
    
    <div class="main-container">
        <div class="container">
            <h2 class="heading">Todo Input</h2>
            <div class="input-container">
                <input type="text" id="input" placeholder="Add Task">
                <button id="addbtn">Add new Task</button>
            </div>
            <h2 class="head">Todo List</h2>
            <div class="buttons">
                <button id="btn1">All</button>
                <button id="btn2">Done</button>
                <button id="btn3">Todo</button>
            </div>
            <div id="task"></div>
            <div class="btns">
                <button id="btn4">Delete Done Task</button>
                <button id="btn5">Delete All Task</button>
            </div>
        </div>
    </div>

    <script src="todo1.js"></script>
</body>
</html>
